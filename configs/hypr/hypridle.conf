general {
    lock_cmd = pidof hyprlock || hyprlock    # don't spawn multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session  # lock before suspend (covers manual sleep too)
    after_sleep_cmd = hyprctl dispatch dpms on  # wake display on resume
}

# Lock screen after 9 minutes of inactivity
listener {
    timeout = 540
    on-timeout = loginctl lock-session
}

# Suspend after 10 minutes of inactivity
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
